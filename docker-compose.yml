services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: covoiturage
      POSTGRES_USER: user
      POSTGRES_PASSWORD: numerilab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./frontend:/usr/share/nginx/html/frontend
    depends_on:
      - backend

volumes:
  pgdata: